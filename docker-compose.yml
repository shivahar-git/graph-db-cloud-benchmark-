version: "3.9"

services:
  neo4j:
    image: neo4j:5.26
    container_name: graph-benchmark-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_PLUGINS: '["apoc"]'

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./datasets:/datasets
      - ./queries:/queries

    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  memgraph:
    image: memgraph/memgraph:latest
    container_name: graph-benchmark-memgraph
    restart: unless-stopped

    ports:
      - "7688:7687"
      - "7444:7444"

    command:
      - "--log-level=INFO"

    volumes:
      - memgraph_data:/var/lib/memgraph
      - ./datasets:/datasets
      - ./queries:/queries

    healthcheck:
      test: ["CMD", "echo", "Memgraph running"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
  memgraph_data:
