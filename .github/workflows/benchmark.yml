name: Graph Database Benchmark

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: neo4j/password
        options: >-
          --health-cmd="cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10

      memgraph:
        image: memgraph/memgraph:latest
        ports:
          - 7688:7687

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate benchmark dataset
        run: |
          python datasets/generate_dataset.py

      - name: Run benchmark
        run: |
          python benchmark.py

      - name: Generate charts
        run: |
          python analysis/plot_results.py

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/**
            analysis/graphs/**
